<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Report</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="web/report.css">
</head>
<body>
<h1>Test Report: {{report_title}}</h1>
{{header_note_html}}
<p class="agent-report-link"><a href="report.md">Agent-readable report (Markdown)</a></p>
<div class="summary-stats">
    <div>
        Total (excl. skipped): <span class="stat-number">{{total_tests}}</span>,
        Passed: <span class="stat-number passed-number">{{passed_tests}}</span>,
        Failed: <span class="stat-number failed-number">{{failed_tests}}</span>,
        Skipped: <span class="stat-number skipped-number">{{skipped_tests}}</span>
    </div>
    <div class="summary-actions">
        <input type="search" id="test-search" class="test-search" placeholder="Filter tests by name...">
        <span class="status-chips">
            <button type="button" class="status-chip" data-status="passed" aria-pressed="true">Passed</button>
            <button type="button" class="status-chip" data-status="failed" aria-pressed="true">Failed</button>
            <button type="button" class="status-chip" data-status="skipped" aria-pressed="true">Skipped</button>
        </span>
        <button id="toggle-all">Collapse All</button>
    </div>
</div>
{{build_results_html}}
{{comparison_info_html}}
<div id="slowest-tests" class="slowest-tests"></div>
{{suite_sections_html}}
<p id="no-match" class="no-match" style="display:none">No tests match.</p>
<script src="web/index-page.js"></script>
</body>
</html>
